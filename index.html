<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProEditor Studio | Home</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-deep: #05050f;
      --card-glass: rgba(16, 18, 27, 0.6);
      --accent-cyan: #00f0ff;
      --accent-pink: #ff007c;
      --accent-purple: #9d00ff;
      --accent-green: #00ff88;
      --text-light: #f8fafc;
      --text-muted: #94a3b8;
      --border-glow: rgba(0, 240, 255, 0.25);
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-deep);
      color: var(--text-light);
      margin: 0;
      padding: 0;
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* === ANIMATED BACKGROUND ORBS === */
    .bg-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      z-index: -1;
      animation: floatOrb 10s infinite alternate ease-in-out;
    }
    .orb-1 {
      width: 400px; height: 400px;
      background: rgba(0, 240, 255, 0.15);
      top: -100px; left: -100px;
    }
    .orb-2 {
      width: 500px; height: 500px;
      background: rgba(255, 0, 124, 0.15);
      bottom: -150px; right: -100px;
      animation-delay: -5s;
    }
    @keyframes floatOrb {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(50px) scale(1.1); }
    }

    /* === TOP NAVIGATION === */
    .top-nav {
      padding: 15px 5%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(5, 5, 15, 0.8);
      border-bottom: 1px solid var(--border-glow);
      backdrop-filter: blur(20px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-logo {
      font-weight: 800;
      font-size: 20px;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    /* === MAIN HERO CONTAINER === */
    .hero-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      animation: slideUpFade 1s ease forwards;
      opacity: 0;
      transform: translateY(20px);
      width: 90%;
      margin: 0 auto;
      padding: 10px 0;
    }

    @keyframes slideUpFade {
      to { opacity: 1; transform: translateY(0); }
    }

    .main-heading {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #ffffff, var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.2;
    }

    .sub-heading {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 25px;
      max-width: 600px;
      font-weight: 400;
    }

    /* === BUTTON CARDS (MOBILE OPTIMIZED - 2x2 GRID) === */
    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      width: 100%;
    }

    .tool-card {
      background: var(--card-glass);
      border: 1px solid var(--border-glow);
      border-radius: 18px;
      padding: 20px 10px;
      text-decoration: none;
      color: var(--text-light);
      backdrop-filter: blur(15px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      overflow: hidden;
      aspect-ratio: 1 / 1;
      cursor: pointer;
    }

    .tool-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 4px;
      transition: height 0.3s ease;
    }

    /* Colored Top Borders */
    .card-img::before { background: linear-gradient(90deg, var(--accent-pink), #ff758c); }
    .card-vid::before { background: linear-gradient(90deg, var(--accent-cyan), #0096ff); }
    .card-aud::before { background: linear-gradient(90deg, var(--accent-purple), #d400ff); }
    .card-wa::before { background: linear-gradient(90deg, var(--accent-green), #00e676); }

    /* === SHINY GLOW HOVER & ACTIVE LOGIC === */
    .card-img:hover {
      border-color: var(--accent-pink);
      box-shadow: 0 0 30px rgba(255, 0, 124, 0.4);
      transform: translateY(-5px);
    }
    .card-vid:hover {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.4);
      transform: translateY(-5px);
    }
    .card-aud:hover {
      border-color: var(--accent-purple);
      box-shadow: 0 0 30px rgba(157, 0, 255, 0.4);
      transform: translateY(-5px);
    }
    .card-wa:hover {
      border-color: var(--accent-green);
      box-shadow: 0 0 30px rgba(0, 255, 136, 0.4);
      transform: translateY(-5px);
    }

    /* For Mobile Touch */
    .tool-card.glow-active {
      transform: scale(0.95);
    }
    
    .card-img.glow-active {
      background: rgba(255, 0, 124, 0.15);
      border-color: var(--accent-pink);
      box-shadow: 0 0 40px rgba(255, 0, 124, 0.8), inset 0 0 20px rgba(255, 0, 124, 0.5);
    }
    
    .card-vid.glow-active {
      background: rgba(0, 240, 255, 0.15);
      border-color: var(--accent-cyan);
      box-shadow: 0 0 40px rgba(0, 240, 255, 0.8), inset 0 0 20px rgba(0, 240, 255, 0.5);
    }

    .card-aud.glow-active {
      background: rgba(157, 0, 255, 0.15);
      border-color: var(--accent-purple);
      box-shadow: 0 0 40px rgba(157, 0, 255, 0.8), inset 0 0 20px rgba(157, 0, 255, 0.5);
    }

    .card-wa.glow-active {
      background: rgba(0, 255, 136, 0.15);
      border-color: var(--accent-green);
      box-shadow: 0 0 40px rgba(0, 255, 136, 0.8), inset 0 0 20px rgba(0, 255, 136, 0.5);
    }

    .tool-card::after {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 50%; height: 100%;
      background: linear-gradient(to right, transparent, rgba(255,255,255,0.3), transparent);
      transform: skewX(-25deg);
      transition: none;
    }

    .tool-card.glow-active::after {
      animation: shineFlash 0.5s ease-out forwards;
    }

    @keyframes shineFlash {
      0% { left: -100%; }
      100% { left: 200%; }
    }

    .tool-icon {
      font-size: 32px;
      margin-bottom: 12px;
      color: var(--text-light);
      transition: color 0.3s ease;
    }

    .card-img:hover .tool-icon, .card-img.glow-active .tool-icon { color: var(--accent-pink); }
    .card-vid:hover .tool-icon, .card-vid.glow-active .tool-icon { color: var(--accent-cyan); }
    .card-aud:hover .tool-icon, .card-aud.glow-active .tool-icon { color: var(--accent-purple); }
    .card-wa:hover .tool-icon, .card-wa.glow-active .tool-icon { color: var(--accent-green); }

    .tool-card h3 {
      margin: 0 0 5px 0;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.2;
    }

    .tool-card p {
      margin: 0;
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.3;
    }

    /* === COLORFUL LOADING OVERLAY === */
    .loader-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.6); 
      backdrop-filter: blur(2px);
      z-index: 1000;
      display: none; 
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .loader-overlay.active {
      display: flex;
    }

    .colorful-spinner {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: conic-gradient(var(--accent-pink), var(--accent-cyan), var(--accent-green), var(--accent-purple), var(--accent-pink));
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #fff 0);
      mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #fff 0);
      animation: spinRing 0.8s linear infinite;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.4);
    }

    .loader-text {
      margin-top: 15px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-light);
      letter-spacing: 1px;
      animation: pulse 1s infinite alternate;
    }

    @keyframes spinRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    /* === FOOTER === */
    footer {
      text-align: center;
      padding: 15px;
      border-top: 1px solid var(--border-glow);
      color: var(--text-muted);
      font-size: 12px;
      background: rgba(5, 5, 15, 0.8);
      backdrop-filter: blur(20px);
      margin-top: auto;
    }

    footer a {
      color: var(--text-muted);
      text-decoration: none;
      margin: 0 8px;
    }

    @media (max-width: 350px) {
      .btn-group { gap: 10px; }
      .tool-card h3 { font-size: 13px; }
      .tool-icon { font-size: 28px; }
    }
  </style>
</head>
<body>

  <!-- Background Animated Orbs -->
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <!-- Top Navigation -->
  <div class="top-nav">
    <span class="brand-logo">ProEditor Studio</span>
  </div>

  <!-- Main Content -->
  <div class="hero-container">
    <h1 class="main-heading">Creative Suite</h1>
    <p class="sub-heading">Select a tool below to get started.</p>
    
    <div class="btn-group">
      <!-- 1. Image Editor Button -->
      <a href="img.html" class="tool-card card-img" onclick="handleNav(event, 'img.html')">
        <i class="fa-solid fa-image tool-icon"></i>
        <h3>Image Editor</h3>
        <p>Advanced filters</p>
      </a>

      <!-- 2. Video Editor Button -->
      <a href="vid.html" class="tool-card card-vid" onclick="handleNav(event, 'vid.html')">
        <i class="fa-solid fa-film tool-icon"></i>
        <h3>Video Editor</h3>
        <p>Timeline & effects</p>
      </a>
      
      <!-- 3. Video to MP3 Button -->
      <a href="audio.html" class="tool-card card-aud" onclick="handleNav(event, 'audio.html')">
        <i class="fa-solid fa-music tool-icon"></i>
        <h3>Video to MP3</h3>
        <p>Extract audio</p>
      </a>
      
      <!-- 4. WA Status Downloader Button -->
      <a href="wa.html" class="tool-card card-wa" onclick="handleNav(event, 'wa.html')">
        <i class="fa-brands fa-whatsapp tool-icon"></i>
        <h3>WA Status</h3>
        <p>Save in HD</p>
      </a>
    </div>
  </div>

  <!-- Colorful Loading Overlay (Hidden by Default) -->
  <div class="loader-overlay" id="loaderOverlay">
    <div class="colorful-spinner"></div>
    <div class="loader-text">Loading...</div>
  </div>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 ProEditor Studio.</p>
    <div style="margin-top: 5px;">
      <a href="#">Terms</a> |
      <a href="privacy.html">Privacy</a>
    </div>
  </footer>

  <script>
    // Ye function page load ya BACK aane par sab clear karega
    window.addEventListener('pageshow', function() {
      document.getElementById('loaderOverlay').classList.remove('active');
      
      const cards = document.querySelectorAll('.tool-card');
      cards.forEach(card => card.classList.remove('glow-active'));
    });

    function handleNav(event, url) {
      event.preventDefault();
      
      const card = event.currentTarget;
      card.classList.add('glow-active');
      
      const loader = document.getElementById('loaderOverlay');
      loader.classList.add('active');
      
      // Delay ko 0.2 seconds (200 milliseconds) kar diya hai
      setTimeout(() => {
        window.location.href = url;
      }, 200); 
    }
  </script>

</body>
</html>
