<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pro Advance Image Editor</title>

  <!-- External Libraries -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- 20+ Google Fonts Added for Text Editing -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Roboto&family=Lato&family=Montserrat&family=Oswald&family=Raleway&family=Poppins&family=Nunito&family=Ubuntu&family=Playfair+Display&family=Merriweather&family=Pacifico&family=Dancing+Script&family=Caveat&family=Anton&family=Lobster&family=Bebas+Neue&family=Fjalla+One&family=Teko&family=Righteous&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-deep: #05050f;
      --card-glass: rgba(16, 18, 27, 0.7);
      --accent-cyan: #00f0ff;
      --accent-pink: #ff007c;
      --text-light: #f8fafc;
      --text-muted: #94a3b8;
      --border-glow: rgba(0, 240, 255, 0.25);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-deep);
      color: var(--text-light);
      overflow-x: hidden;
      user-select: none;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* === ANIMATED BACKGROUND ORBS === */
    .bg-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      z-index: -1;
      animation: floatOrb 10s infinite alternate ease-in-out;
      pointer-events: none;
    }
    .orb-1 { width: 380px; height: 380px; background: rgba(0, 240, 255, 0.18); top: -80px; left: -80px; }
    .orb-2 { width: 450px; height: 450px; background: rgba(255, 0, 124, 0.18); bottom: -100px; right: -80px; animation-delay: -5s; }
    @keyframes floatOrb {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(40px) scale(1.08); }
    }

    /* === TOP NAVBAR === */
    .top-nav {
      height: 60px;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(5, 5, 15, 0.85);
      border-bottom: 1px solid var(--border-glow);
      backdrop-filter: blur(20px);
      z-index: 1000;
    }

    .brand-logo {
      font-weight: 800;
      font-size: 20px;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .action-top-btn {
      padding: 10px 20px;
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.2), rgba(255, 0, 124, 0.2));
      color: var(--text-light);
      border: 1px solid var(--border-glow);
      border-radius: 25px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(10px);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }
    .action-top-btn:hover { border-color: var(--accent-cyan); box-shadow: 0 0 20px rgba(0, 240, 255, 0.4); transform: translateY(-2px); }
    .action-top-btn.save-mode { background: linear-gradient(90deg, var(--accent-cyan), #0096ff); color: #000; border: none; }

    /* === WORKSPACE AREA === */
    .workspace-wrapper {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow: hidden;
    }

    .empty-state-box {
      text-align: center;
      padding: 40px;
      background: var(--card-glass);
      border: 1px dashed var(--border-glow);
      border-radius: 24px;
      backdrop-filter: blur(15px);
      cursor: pointer;
      max-width: 320px;
      transition: transform 0.3s;
    }
    .empty-state-box:hover { transform: scale(1.03); border-color: var(--accent-cyan); }
    .empty-state-box i { font-size: 48px; color: var(--accent-cyan); margin-bottom: 15px; }
    .empty-state-box p { margin: 0; font-size: 14px; color: var(--text-muted); }

    .canvas-container {
      position: relative;
      max-width: 100%;
      max-height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    #mainCanvas {
      max-width: 100%;
      max-height: calc(100vh - 220px);
      object-fit: contain;
      display: block;
      border-radius: 12px;
    }

    /* === INSHOT STYLE OVERLAY LAYERS === */
    .movable-layer {
      position: absolute;
      cursor: move;
      border: 1.5px solid transparent; /* Changed to match InShot */
      padding: 6px;
      user-select: none;
      z-index: 100;
      transform-origin: center center;
      touch-action: none;
      display: none;
    }
    .movable-layer.active { display: inline-block; }
    
    /* InShot Selected State */
    .movable-layer.selected {
      border-color: #ffffff;
      box-shadow: 0 0 8px rgba(0,0,0,0.5);
    }

    #textLayerDisplay {
      font-size: 28px;
      font-weight: 800;
      color: #ffffff;
      white-space: nowrap;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
      font-family: 'Inter', sans-serif;
    }

    .layer-handle {
      position: absolute;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      z-index: 101;
      box-shadow: 0 2px 5px rgba(0,0,0,0.5);
    }
    .movable-layer.selected .layer-handle { display: flex; }
    
    /* InShot Handlers */
    .handle-delete { 
      top: -13px; left: -13px; 
      background: #ff4a4a; 
      color: white; 
      cursor: pointer; 
    }
    .handle-resize { 
      bottom: -13px; right: -13px; 
      background: #ffffff; 
      color: #000; 
      cursor: nwse-resize; 
      font-size: 14px;
    }

    /* === EDIT PANEL === */
    .edit-panel {
      background: rgba(10, 10, 20, 0.9);
      border-top: 1px solid var(--border-glow);
      backdrop-filter: blur(20px);
      z-index: 500;
      display: flex;
      flex-direction: column;
    }

    .sub-panel {
      display: none;
      padding: 15px 20px;
      background: var(--card-glass);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      overflow-x: auto;
      gap: 20px;
      align-items: center;
      scrollbar-width: none;
    }
    .sub-panel::-webkit-scrollbar { display: none; }
    .sub-panel.active { display: flex; }

    /* Sliders & Tools Styling */
    .slider-box { display: flex; flex-direction: column; gap: 6px; min-width: 130px; text-align: center; }
    .slider-box label { font-size: 12px; color: var(--text-muted); font-weight: 600; }
    .slider-box input[type="range"] { width: 100%; accent-color: var(--accent-cyan); cursor: pointer; }

    .filter-card {
      flex: 0 0 85px; display: flex; flex-direction: column; align-items: center; gap: 6px;
      cursor: pointer; border-radius: 12px; padding: 6px; border: 1px solid transparent; transition: all 0.2s;
    }
    .filter-card:hover, .filter-card.active { border-color: var(--accent-cyan); background: rgba(0, 240, 255, 0.08); }
    .filter-preview-box { width: 70px; height: 70px; border-radius: 10px; background-size: cover; background-position: center; border: 1px solid rgba(255, 255, 255, 0.1); }
    .filter-card span { font-size: 11px; font-weight: 600; color: var(--text-muted); }

    .tool-bar {
      display: flex; overflow-x: auto; padding: 12px 15px; gap: 22px; white-space: nowrap; scrollbar-width: none;
    }
    .tool-bar::-webkit-scrollbar { display: none; }
    .tool-btn {
      background: transparent; border: none; color: var(--text-muted); font-size: 12px; font-weight: 600;
      cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px; flex-shrink: 0; transition: color 0.2s;
    }
    .tool-btn i { font-size: 20px; }
    .tool-btn.active, .tool-btn:hover { color: var(--accent-cyan); }
    
    /* Text Customization Elements */
    .text-controls {
      display: flex; gap: 10px; align-items: center; background: #1e1e2d; padding: 5px 10px; border-radius: 8px;
    }
    .text-controls input[type="text"] { background: transparent; border: none; color: white; outline: none; width: 150px; }
    .text-controls select, .text-controls input[type="color"] { background: transparent; color: white; border: 1px solid var(--border-glow); border-radius: 4px; padding: 4px; outline: none;}
    .text-controls input[type="color"] { width: 35px; height: 30px; padding: 0; cursor: pointer; }

    /* === LOADING OVERLAY MODAL === */
    .loader-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(5, 5, 15, 0.85); backdrop-filter: blur(20px); z-index: 9999;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
    }
    .loader-overlay.show { opacity: 1; pointer-events: auto; }
    .spinner {
      width: 60px; height: 60px; border: 4px solid rgba(0, 240, 255, 0.15); border-top-color: var(--accent-cyan);
      border-right-color: var(--accent-pink); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-text { font-weight: 700; font-size: 16px; background: linear-gradient(90deg, var(--accent-cyan), var(--accent-pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  </style>
</head>
<body>

  <!-- Animated Glass Orbs -->
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <!-- Loading Overlay Modal -->
  <div id="loaderModal" class="loader-overlay">
    <div class="spinner"></div>
    <div id="loaderText" class="loader-text">Importing Photo...</div>
  </div>

  <!-- Hidden File Inputs -->
  <input type="file" id="imageInput" accept="image/*" onchange="handleImageImport(event)" style="display:none;">
  <input type="file" id="pipInput" accept="image/*" onchange="spawnPipOverlay(event)" style="display:none;">

  <!-- TOP NAVBAR -->
  <div class="top-nav">
    <span class="brand-logo">ProEditor Studio</span>
    <button id="topActionButton" class="action-top-btn" onclick="triggerTopAction()">
      <i class="fa-solid fa-plus"></i> <span id="topBtnText">Import Photo</span>
    </button>
  </div>

  <!-- WORKSPACE -->
  <div class="workspace-wrapper" id="workspaceWrapper">
    <!-- Initial Empty Upload Box -->
    <div id="emptyState" class="empty-state-box" onclick="document.getElementById('imageInput').click()">
      <i class="fa-solid fa-cloud-arrow-up"></i>
      <h3>Select a Photo</h3>
      <p>Tap here to import an image and unlock advanced editing tools.</p>
    </div>

    <!-- Active Canvas & Movable Layers -->
    <div id="canvasBox" class="canvas-container" style="display:none;">
      <img id="mainCanvas" src="" alt="Editing Target">

      <!-- Text Overlay Layer (InShot Style) -->
      <div id="movableTextLayer" class="movable-layer">
        <div class="layer-handle handle-delete" onclick="removeLayer('text')"><i class="fa-solid fa-xmark"></i></div>
        <span id="textLayerDisplay">Custom Text</span>
        <div class="layer-handle handle-resize" onmousedown="initCombinedTransform(event, 'text')" ontouchstart="initCombinedTransform(event, 'text')"><i class="fa-solid fa-up-right-and-down-left-from-center"></i></div>
      </div>

      <!-- PIP Overlay Layer (InShot Style) -->
      <div id="movablePipLayer" class="movable-layer">
        <div class="layer-handle handle-delete" onclick="removeLayer('pip')"><i class="fa-solid fa-xmark"></i></div>
        <img id="pipImgDisplay" style="width:100px; height:100px; object-fit:contain; display:block; pointer-events:none;">
        <div class="layer-handle handle-resize" onmousedown="initCombinedTransform(event, 'pip')" ontouchstart="initCombinedTransform(event, 'pip')"><i class="fa-solid fa-up-right-and-down-left-from-center"></i></div>
      </div>
    </div>
  </div>

  <!-- EDIT PANEL ENGINE -->
  <div class="edit-panel" id="editPanel" style="opacity: 0.5; pointer-events: none;">

    <!-- Sub Panel 1: Adjustments (All Old Options Kept) -->
    <div id="adjustPanel" class="sub-panel">
      <div class="slider-box"><label>Brightness</label><input type="range" id="adj_brightness" min="-100" max="100" value="0" oninput="applyEffects()" onchange="saveHistory()"></div>
      <div class="slider-box"><label>Contrast</label><input type="range" id="adj_contrast" min="-100" max="100" value="0" oninput="applyEffects()" onchange="saveHistory()"></div>
      <div class="slider-box"><label>Saturation</label><input type="range" id="adj_saturation" min="-100" max="100" value="0" oninput="applyEffects()" onchange="saveHistory()"></div>
      <div class="slider-box"><label>Blur</label><input type="range" id="adj_blur" min="0" max="20" value="0" oninput="applyEffects()" onchange="saveHistory()"></div>
      <div class="slider-box"><label>Hue Rotate</label><input type="range" id="adj_hue" min="0" max="360" value="0" oninput="applyEffects()" onchange="saveHistory()"></div>
      <div class="slider-box"><label>Sepia</label><input type="range" id="adj_sepia" min="0" max="100" value="0" oninput="applyEffects()" onchange="saveHistory()"></div>
      <div class="slider-box"><label>Invert</label><input type="range" id="adj_invert" min="0" max="100" value="0" oninput="applyEffects()" onchange="saveHistory()"></div>
      <div class="slider-box"><label>Grayscale</label><input type="range" id="adj_grayscale" min="0" max="100" value="0" oninput="applyEffects()" onchange="saveHistory()"></div>
      <div class="slider-box"><label>Opacity</label><input type="range" id="adj_opacity" min="0" max="100" value="100" oninput="applyEffects()" onchange="saveHistory()"></div>
      <div class="slider-box"><label>Warmth</label><input type="range" id="adj_warmth" min="-50" max="50" value="0" oninput="applyEffects()" onchange="saveHistory()"></div>
      <div class="slider-box"><label>Exposure</label><input type="range" id="adj_exposure" min="-100" max="100" value="0" oninput="applyEffects()" onchange="saveHistory()"></div>
      <div class="slider-box"><label>Vibrance</label><input type="range" id="adj_vibrance" min="-100" max="100" value="0" oninput="applyEffects()" onchange="saveHistory()"></div>
      <button onclick="resetAdjustments()" style="background:var(--accent-pink); color:white; border:none; padding:6px 12px; border-radius:8px; font-weight:bold; cursor:pointer;">Reset</button>
    </div>

    <!-- Sub Panel 2: 18 Premium Filters -->
    <div id="filterPanel" class="sub-panel">
      <!-- Generated via JS -->
    </div>

    <!-- Sub Panel 3: Live Text Input Controls with Fonts & Color -->
    <div id="textPanel" class="sub-panel">
      <div class="text-controls">
        <input type="text" id="textInputVal" placeholder="Type here..." oninput="updateLiveText()">
        <input type="color" id="textColorVal" value="#ffffff" oninput="updateLiveText()">
        <select id="textFontVal" onchange="updateLiveText()">
          <option value="Inter">Inter</option> <option value="Roboto">Roboto</option>
          <option value="Lato">Lato</option> <option value="Montserrat">Montserrat</option>
          <option value="Oswald">Oswald</option> <option value="Raleway">Raleway</option>
          <option value="Poppins">Poppins</option> <option value="Nunito">Nunito</option>
          <option value="Ubuntu">Ubuntu</option> <option value="Playfair Display">Playfair</option>
          <option value="Merriweather">Merriweather</option> <option value="Pacifico">Pacifico</option>
          <option value="Dancing Script">Dancing Script</option> <option value="Caveat">Caveat</option>
          <option value="Anton">Anton</option> <option value="Lobster">Lobster</option>
          <option value="Bebas Neue">Bebas Neue</option> <option value="Fjalla One">Fjalla</option>
          <option value="Teko">Teko</option> <option value="Righteous">Righteous</option>
        </select>
      </div>
      <!-- Right Arrow Checkmark to place text -->
      <button onclick="placeTextRightArrow()" style="background:var(--accent-cyan); color:#000; border:none; padding:8px 16px; border-radius:8px; font-weight:bold; cursor:pointer; display:flex; align-items:center; gap:5px;">
        Place <i class="fa-solid fa-arrow-right"></i>
      </button>
    </div>

    <!-- Sub Panel 4: Crop Controls (0px logic + Auto Sizes Added) -->
    <div id="cropPanel" class="sub-panel">
      <!-- Added Aspect Ratios directly inside crop for convenience without removing canvas option -->
      <button class="tool-btn" onclick="setCanvasRatio('free')"><i class="fa-solid fa-expand"></i>Free</button>
      <button class="tool-btn" onclick="setCanvasRatio(NaN)"><i class="fa-solid fa-image"></i>Original</button>
      <button class="tool-btn" onclick="setCanvasRatio(1)"><i class="fa-solid fa-square"></i>1:1</button>
      <button class="tool-btn" onclick="setCanvasRatio(4/5)"><i class="fa-solid fa-rectangle-ad"></i>4:5</button>
      <button class="tool-btn" onclick="setCanvasRatio(9/16)"><i class="fa-solid fa-mobile-screen"></i>9:16</button>
      <button class="tool-btn" onclick="setCanvasRatio(16/9)"><i class="fa-solid fa-desktop"></i>16:9</button>
      <div style="flex:1;"></div>
      <button onclick="applyCrop()" style="background:var(--accent-cyan); color:#000; border:none; padding:8px 18px; border-radius:8px; font-weight:bold; cursor:pointer;">✔ Apply</button>
      <button onclick="cancelCrop()" style="background:rgba(255,255,255,0.1); color:white; border:none; padding:8px 18px; border-radius:8px; font-weight:bold; cursor:pointer;">Cancel</button>
    </div>

    <!-- Sub Panel 5: Canvas Aspect Ratio (Old Option Maintained) -->
    <div id="canvasPanel" class="sub-panel">
      <button class="tool-btn" onclick="setCanvasRatio('free')"><i class="fa-solid fa-expand"></i>Free</button>
      <button class="tool-btn" onclick="setCanvasRatio(1)"><i class="fa-solid fa-square"></i>1:1 (Insta)</button>
      <button class="tool-btn" onclick="setCanvasRatio(4/5)"><i class="fa-solid fa-rectangle-ad"></i>4:5 (Post)</button>
      <button class="tool-btn" onclick="setCanvasRatio(16/9)"><i class="fa-solid fa-desktop"></i>16:9 (YT)</button>
      <button class="tool-btn" onclick="setCanvasRatio(9/16)"><i class="fa-solid fa-mobile-screen"></i>9:16 (Reels)</button>
    </div>

    <!-- Main InShot Scrollable Tools Row -->
    <div class="tool-bar">
      <!-- Undo / Redo Added at the VERY FIRST -->
      <button class="tool-btn" onclick="undoState()"><i class="fa-solid fa-arrow-rotate-left"></i>Undo</button>
      <button class="tool-btn" onclick="redoState()"><i class="fa-solid fa-arrow-rotate-right"></i>Redo</button>
      <div style="width:1px; height:30px; background:rgba(255,255,255,0.2); margin:0 5px;"></div>
      
      <!-- Existing Tools Maintained -->
      <button class="tool-btn" onclick="toggleSubPanel('adjustPanel')"><i class="fa-solid fa-sliders"></i>Adjust</button>
      <button class="tool-btn" onclick="toggleSubPanel('filterPanel')"><i class="fa-solid fa-wand-magic-sparkles"></i>Filter</button>
      <button class="tool-btn" onclick="startCropMode()"><i class="fa-solid fa-crop-simple"></i>Crop</button>
      <button class="tool-btn" onclick="activateTextTool()"><i class="fa-solid fa-font"></i>Text</button>
      <button class="tool-btn" onclick="document.getElementById('pipInput').click()"><i class="fa-solid fa-images"></i>PIP</button>
      <button class="tool-btn" onclick="toggleSubPanel('canvasPanel')"><i class="fa-solid fa-border-all"></i>Canvas</button>
      <button class="tool-btn" onclick="rotateImage(90)"><i class="fa-solid fa-rotate-right"></i>Rotate</button>
      <button class="tool-btn" onclick="flipImage('h')"><i class="fa-solid fa-arrows-left-right"></i>Flip H</button>
      <button class="tool-btn" onclick="flipImage('v')"><i class="fa-solid fa-arrows-up-down"></i>Flip V</button>
      <button class="tool-btn" onclick="resetAllEditor()" style="color:var(--accent-pink);"><i class="fa-solid fa-trash-arrow-up"></i>Reset All</button>
    </div>
  </div>

  <script>
    // === APPLICATION STATE & HISTORY (Undo/Redo Logic Added) ===
    let originalImageSrc = null;
    let currentImageSrc = null;
    let hasImage = false;
    let cropper = null;
    let activeFilterCss = 'none';

    let layers = {
      text: { relX: 0.1, relY: 0.2, rotation: 0, fontSize: 28 },
      pip: { relX: 0.2, relY: 0.3, rotation: 0, width: 120 }
    };

    let historyStack = [];
    let historyIndex = -1;
    let isRestoring = false;

    // 18 Preset Filters Data Maintained
    const filterPresets = [
      { name: 'Original', filter: 'none' },
      { name: 'Cyberpunk', filter: 'hue-rotate(180deg) contrast(130%) saturate(160%)' },
      { name: '90s Retro', filter: 'sepia(40%) contrast(110%) brightness(105%) saturate(130%)' },
      { name: 'Warm Gold', filter: 'sepia(25%) saturate(140%) brightness(108%)' },
      { name: 'Cold Winter', filter: 'hue-rotate(190deg) saturate(80%) brightness(105%)' },
      { name: 'Noir B&W', filter: 'grayscale(100%) contrast(150%)' },
      { name: 'Emerald', filter: 'hue-rotate(80deg) saturate(140%)' },
      { name: 'Sunset Glow', filter: 'sepia(50%) hue-rotate(-20deg) saturate(180%)' },
      { name: 'Sepia Dream', filter: 'sepia(100%) contrast(90%)' },
      { name: 'Neon Invert', filter: 'invert(100%) hue-rotate(180deg)' },
      { name: 'Vintage 80s', filter: 'contrast(120%) brightness(90%) sepia(30%)' },
      { name: 'Midnight', filter: 'brightness(80%) contrast(140%) hue-rotate(200deg)' },
      { name: 'Pastel Cyan', filter: 'hue-rotate(150deg) brightness(115%) saturate(80%)' },
      { name: 'Pop High', filter: 'saturate(200%) contrast(125%)' },
      { name: 'Moody Dark', filter: 'brightness(75%) contrast(130%) saturate(90%)' },
      { name: 'Soft Fade', filter: 'brightness(110%) contrast(85%) saturate(90%)' },
      { name: 'Solarize', filter: 'invert(50%) contrast(150%)' },
      { name: 'Vaporwave', filter: 'hue-rotate(280deg) saturate(170%) contrast(110%)' }
    ];

    document.addEventListener("DOMContentLoaded", () => {
      renderFilterCards();
    });

    // === SAVE, UNDO & REDO CORE ENGINE ===
    function saveHistory() {
      if(isRestoring || !hasImage) return;
      const state = {
        img: currentImageSrc, filter: activeFilterCss,
        sliders: ['brightness','contrast','saturation','blur','hue','sepia','invert','grayscale','opacity','warmth','exposure','vibrance'].reduce((acc, val) => {
          acc[val] = document.getElementById("adj_"+val).value; return acc;
        }, {}),
        textActive: document.getElementById("movableTextLayer").classList.contains("active"),
        textVal: document.getElementById("textLayerDisplay").innerText,
        textColor: document.getElementById("textLayerDisplay").style.color,
        textFont: document.getElementById("textLayerDisplay").style.fontFamily,
        textX: layers.text.relX, textY: layers.text.relY, textRot: layers.text.rotation, textFS: layers.text.fontSize,
        pipActive: document.getElementById("movablePipLayer").classList.contains("active"),
        pipSrc: document.getElementById("pipImgDisplay").src,
        pipX: layers.pip.relX, pipY: layers.pip.relY, pipRot: layers.pip.rotation, pipW: layers.pip.width
      };
      
      if(historyIndex < historyStack.length - 1) historyStack = historyStack.slice(0, historyIndex + 1);
      historyStack.push(state);
      historyIndex++;
    }

    function undoState() {
      if(historyIndex > 0) { historyIndex--; restoreState(historyStack[historyIndex]); }
    }
    function redoState() {
      if(historyIndex < historyStack.length - 1) { historyIndex++; restoreState(historyStack[historyIndex]); }
    }

    function restoreState(s) {
      isRestoring = true;
      currentImageSrc = s.img;
      document.getElementById("mainCanvas").src = currentImageSrc;
      activeFilterCss = s.filter;
      
      Object.keys(s.sliders).forEach(k => document.getElementById("adj_"+k).value = s.sliders[k]);
      applyEffects();
      renderFilterCards();

      const tL = document.getElementById("movableTextLayer");
      if(s.textActive) {
        tL.classList.add("active");
        document.getElementById("textLayerDisplay").innerText = s.textVal;
        document.getElementById("textLayerDisplay").style.color = s.textColor;
        document.getElementById("textLayerDisplay").style.fontFamily = s.textFont;
        layers.text.relX = s.textX; layers.text.relY = s.textY; layers.text.rotation = s.textRot; layers.text.fontSize = s.textFS;
        document.getElementById("textLayerDisplay").style.fontSize = layers.text.fontSize + "px";
        applyLayerTransform('text');
      } else { tL.classList.remove("active"); }

      const pL = document.getElementById("movablePipLayer");
      if(s.pipActive) {
        pL.classList.add("active");
        document.getElementById("pipImgDisplay").src = s.pipSrc;
        layers.pip.relX = s.pipX; layers.pip.relY = s.pipY; layers.pip.rotation = s.pipRot; layers.pip.width = s.pipW;
        document.getElementById("pipImgDisplay").style.width = layers.pip.width + "px";
        applyLayerTransform('pip');
      } else { pL.classList.remove("active"); }
      
      isRestoring = false;
    }

    // === OUTSIDE CLICK TO CLOSE PANELS & SAVE ===
    document.getElementById("workspaceWrapper").addEventListener('click', function(e) {
      // If user taps in the blank workspace or on canvas, hide popups and unselect layers.
      if (e.target.id === 'workspaceWrapper' || e.target.id === 'mainCanvas' || e.target.id === 'canvasBox') {
        document.querySelectorAll(".sub-panel").forEach(p => p.classList.remove("active"));
        document.getElementById("movableTextLayer").classList.remove("selected");
        document.getElementById("movablePipLayer").classList.remove("selected");
      }
    });

    // Populate Filter Cards Grid
    function renderFilterCards() {
      const panel = document.getElementById("filterPanel");
      panel.innerHTML = "";
      filterPresets.forEach((p, idx) => {
        const card = document.createElement("div");
        card.className = "filter-card" + (p.filter === activeFilterCss || (idx===0 && activeFilterCss==='none') ? " active" : "");
        card.onclick = () => selectFilter(p.filter, card);
        card.innerHTML = `
          <div class="filter-preview-box" style="filter: ${p.filter}; background-image: url('${currentImageSrc || 'https://via.placeholder.com/100'}');"></div>
          <span>${p.name}</span>
        `;
        panel.appendChild(card);
      });
    }

    // === LOADER & ACTIONS ===
    function showLoader(msg) {
      document.getElementById("loaderText").innerText = msg;
      document.getElementById("loaderModal").classList.add("show");
    }
    function hideLoader() { document.getElementById("loaderModal").classList.remove("show"); }

    function triggerTopAction() {
      if (!hasImage) document.getElementById("imageInput").click();
      else exportAndSavePhoto();
    }

    function handleImageImport(e) {
      const file = e.target.files[0];
      if (!file) return;
      showLoader("Importing & Optimizing Photo...");
      setTimeout(() => {
        const url = URL.createObjectURL(file);
        originalImageSrc = url; currentImageSrc = url;
        document.getElementById("mainCanvas").src = url;
        document.getElementById("emptyState").style.display = "none";
        document.getElementById("canvasBox").style.display = "flex";
        document.getElementById("editPanel").style.opacity = "1";
        document.getElementById("editPanel").style.pointerEvents = "auto";
        hasImage = true;
        const topBtn = document.getElementById("topActionButton");
        topBtn.classList.add("save-mode");
        topBtn.innerHTML = `<i class="fa-solid fa-floppy-disk"></i> <span>Save Photo</span>`;
        renderFilterCards();
        saveHistory(); // Save initial state
        hideLoader();
      }, 600);
    }

    // === EDITING ENGINE & ADJUSTMENTS ===
    function applyEffects() {
      if (!hasImage) return;
      const b = document.getElementById("adj_brightness").value;
      const c = document.getElementById("adj_contrast").value;
      const s = document.getElementById("adj_saturation").value;
      const blur = document.getElementById("adj_blur").value;
      const h = document.getElementById("adj_hue").value;
      const sep = document.getElementById("adj_sepia").value;
      const inv = document.getElementById("adj_invert").value;
      const gray = document.getElementById("adj_grayscale").value;
      const op = document.getElementById("adj_opacity").value;
      const w = document.getElementById("adj_warmth").value;
      const exp = document.getElementById("adj_exposure").value;
      const vib = document.getElementById("adj_vibrance").value;

      let customChain = `brightness(${100 + Number(b) + Number(exp)}%) contrast(${100 + Number(c)}%) saturate(${100 + Number(s) + Number(vib)}%) blur(${blur}px) hue-rotate(${Number(h) + Number(w)}deg) sepia(${sep}%) invert(${inv}%) grayscale(${gray}%) opacity(${op}%) `;
      const fullFilterStr = (activeFilterCss !== 'none' ? activeFilterCss + " " : "") + customChain;
      document.getElementById("mainCanvas").style.filter = fullFilterStr;
    }

    function selectFilter(filterStr, cardEl) {
      document.querySelectorAll(".filter-card").forEach(c => c.classList.remove("active"));
      if (cardEl) cardEl.classList.add("active");
      activeFilterCss = filterStr;
      applyEffects();
      saveHistory(); // Save history on filter change
    }

    function resetAdjustments() {
      const sliders = ['brightness', 'contrast', 'saturation', 'blur', 'hue', 'sepia', 'invert', 'grayscale', 'warmth', 'exposure', 'vibrance'];
      sliders.forEach(s => { const el = document.getElementById("adj_" + s); if (el) el.value = 0; });
      document.getElementById("adj_opacity").value = 100;
      applyEffects();
      saveHistory();
    }

    function toggleSubPanel(panelId) {
      killCropper();
      const panel = document.getElementById(panelId);
      const isOpen = panel.classList.contains("active");
      document.querySelectorAll(".sub-panel").forEach(p => p.classList.remove("active"));
      if (!isOpen) panel.classList.add("active");
    }

    // === CROPPER JS INTEGRATION (0px Selection Logic added) ===
    function startCropMode() {
      if (!hasImage) return;
      toggleSubPanel("cropPanel");
      const img = document.getElementById("mainCanvas");
      if (cropper) cropper.destroy();
      cropper = new Cropper(img, {
        viewMode: 1,
        autoCropArea: 1, // Changed from 0.8 to 1 for 0px from edges logic requested
        background: false
      });
    }
    function applyCrop() {
      if (!cropper) return;
      showLoader("Cropping Image...");
      setTimeout(() => {
        currentImageSrc = cropper.getCroppedCanvas().toDataURL("image/jpeg", 0.95);
        document.getElementById("mainCanvas").src = currentImageSrc;
        killCropper();
        renderFilterCards();
        saveHistory(); // Save post crop
        hideLoader();
      }, 400);
    }
    function cancelCrop() { killCropper(); }
    function killCropper() {
      if (cropper) { cropper.destroy(); cropper = null; }
      document.getElementById("cropPanel").classList.remove("active");
    }
    function setCanvasRatio(ratio) {
      if (!hasImage) return;
      if (!cropper) startCropMode();
      if (ratio === 'free') cropper.setAspectRatio(NaN);
      else cropper.setAspectRatio(ratio);
    }

    // === ROTATE & FLIP ===
    function rotateImage(deg) {
      if (!hasImage) return;
      const img = document.getElementById("mainCanvas");
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      const image = new Image();
      image.onload = () => {
        canvas.width = image.height; canvas.height = image.width;
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.rotate((deg * Math.PI) / 180);
        ctx.drawImage(image, -image.width / 2, -image.height / 2);
        currentImageSrc = canvas.toDataURL("image/jpeg", 0.95);
        img.src = currentImageSrc; renderFilterCards();
        saveHistory();
      };
      image.src = currentImageSrc;
    }

    function flipImage(dir) {
      if (!hasImage) return;
      const img = document.getElementById("mainCanvas");
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      const image = new Image();
      image.onload = () => {
        canvas.width = image.width; canvas.height = image.height;
        ctx.translate(dir === 'h' ? canvas.width : 0, dir === 'v' ? canvas.height : 0);
        ctx.scale(dir === 'h' ? -1 : 1, dir === 'v' ? -1 : 1);
        ctx.drawImage(image, 0, 0);
        currentImageSrc = canvas.toDataURL("image/jpeg", 0.95);
        img.src = currentImageSrc; saveHistory();
      };
      image.src = currentImageSrc;
    }

    // === MOVABLE LAYERS (TEXT & PIP INSHOT STYLE) ===
    
    // Live Text Logic added
    function activateTextTool() {
      if (!hasImage) return;
      toggleSubPanel('textPanel');
      const el = document.getElementById("movableTextLayer");
      if (!el.classList.contains("active")) {
        el.classList.add("active", "selected");
        document.getElementById("textInputVal").value = "Custom Text";
        updateLiveText();
      } else {
        el.classList.add("selected");
      }
      document.getElementById("textInputVal").focus();
      attachLayerDrag('text');
    }

    function updateLiveText() {
      const val = document.getElementById("textInputVal").value;
      const color = document.getElementById("textColorVal").value;
      const font = document.getElementById("textFontVal").value;
      const display = document.getElementById("textLayerDisplay");
      
      display.innerText = val || " ";
      display.style.color = color;
      display.style.fontFamily = font;
    }

    function placeTextRightArrow() {
      document.getElementById("movableTextLayer").classList.remove("selected");
      document.getElementById("textPanel").classList.remove("active");
      saveHistory(); // Save action mapped to right arrow
    }

    // Touch Text to re-edit
    document.getElementById("movableTextLayer").addEventListener('click', (e) => {
      if(e.target.classList.contains('layer-handle')) return;
      document.getElementById("movableTextLayer").classList.add("selected");
      toggleSubPanel('textPanel');
      document.getElementById("textInputVal").value = document.getElementById("textLayerDisplay").innerText;
    });

    function spawnPipOverlay(e) {
      const file = e.target.files[0];
      if (!file || !hasImage) return;
      const url = URL.createObjectURL(file);
      document.getElementById("pipImgDisplay").src = url;
      const el = document.getElementById("movablePipLayer");
      el.classList.add("active", "selected");
      applyLayerTransform('pip');
      attachLayerDrag('pip');
      saveHistory();
    }

    document.getElementById("movablePipLayer").addEventListener('click', (e) => {
      if(e.target.classList.contains('layer-handle')) return;
      document.getElementById("movablePipLayer").classList.add("selected");
    });

    function removeLayer(type) {
      const el = (type === 'text') ? document.getElementById("movableTextLayer") : document.getElementById("movablePipLayer");
      el.classList.remove("active", "selected");
      saveHistory();
    }

    function applyLayerTransform(type) {
      const l = layers[type];
      const el = (type === 'text') ? document.getElementById("movableTextLayer") : document.getElementById("movablePipLayer");
      el.style.left = (l.relX * 100) + "%";
      el.style.top = (l.relY * 100) + "%";
      el.style.transform = `translate(-50%, -50%) rotate(${l.rotation}deg)`;
    }

    function attachLayerDrag(type) {
      const el = (type === 'text') ? document.getElementById("movableTextLayer") : document.getElementById("movablePipLayer");
      
      const onStart = (e) => {
        if (e.target.closest('.layer-handle')) return;
        const isTouch = e.type.startsWith('touch');
        const startX = isTouch ? e.touches[0].clientX : e.clientX;
        const startY = isTouch ? e.touches[0].clientY : e.clientY;
        const rect = document.getElementById("canvasBox").getBoundingClientRect();
        
        // Unselect others
        if(type==='text') document.getElementById("movablePipLayer").classList.remove("selected");
        if(type==='pip') document.getElementById("movableTextLayer").classList.remove("selected");

        const onMove = (ev) => {
          const cX = ev.type.startsWith('touch') ? ev.touches[0].clientX : ev.clientX;
          const cY = ev.type.startsWith('touch') ? ev.touches[0].clientY : ev.clientY;
          layers[type].relX = Math.max(0, Math.min(1, (cX - rect.left) / rect.width));
          layers[type].relY = Math.max(0, Math.min(1, (cY - rect.top) / rect.height));
          applyLayerTransform(type);
        };

        const onEnd = () => {
          document.removeEventListener("mousemove", onMove); document.removeEventListener("touchmove", onMove);
          document.removeEventListener("mouseup", onEnd); document.removeEventListener("touchend", onEnd);
          saveHistory();
        };

        document.addEventListener("mousemove", onMove); document.addEventListener("touchmove", onMove);
        document.addEventListener("mouseup", onEnd); document.addEventListener("touchend", onEnd);
      };
      el.onmousedown = onStart; el.ontouchstart = onStart;
    }

    // InShot style combined Resize & Rotate handle Logic
    function initCombinedTransform(e, type) {
      e.stopPropagation(); e.preventDefault();
      const el = (type === 'text') ? document.getElementById("movableTextLayer") : document.getElementById("movablePipLayer");
      const rect = el.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      
      const startX = e.type.startsWith('touch') ? e.touches[0].clientX : e.clientX;
      const startY = e.type.startsWith('touch') ? e.touches[0].clientY : e.clientY;
      const startDist = Math.sqrt(Math.pow(startX - centerX, 2) + Math.pow(startY - centerY, 2));
      const startAngle = Math.atan2(startY - centerY, startX - centerX);
      
      const startSize = type === 'text' ? layers.text.fontSize : layers.pip.width;
      const startRot = layers[type].rotation;

      const onMove = (ev) => {
        const cX = ev.type.startsWith('touch') ? ev.touches[0].clientX : ev.clientX;
        const cY = ev.type.startsWith('touch') ? ev.touches[0].clientY : ev.clientY;
        
        // Calculate Rotation
        const newAngle = Math.atan2(cY - centerY, cX - centerX);
        const angleDiff = (newAngle - startAngle) * (180 / Math.PI);
        layers[type].rotation = startRot + angleDiff;

        // Calculate Scale
        const newDist = Math.sqrt(Math.pow(cX - centerX, 2) + Math.pow(cY - centerY, 2));
        const scale = newDist / (startDist || 1);
        
        if (type === 'text') {
          layers.text.fontSize = Math.max(12, startSize * scale);
          document.getElementById("textLayerDisplay").style.fontSize = layers.text.fontSize + "px";
        } else {
          layers.pip.width = Math.max(30, startSize * scale);
          document.getElementById("pipImgDisplay").style.width = layers.pip.width + "px";
        }
        applyLayerTransform(type);
      };

      const onEnd = () => {
        document.removeEventListener("mousemove", onMove); document.removeEventListener("touchmove", onMove);
        document.removeEventListener("mouseup", onEnd); document.removeEventListener("touchend", onEnd);
        saveHistory();
      };
      
      document.addEventListener("mousemove", onMove); document.addEventListener("touchmove", onMove);
      document.addEventListener("mouseup", onEnd); document.addEventListener("touchend", onEnd);
    }

    // === EXPORT & SAVE LOGIC ===
    function exportAndSavePhoto() {
      if (!hasImage) return;
      showLoader("Rendering High Quality Photo...");
      setTimeout(() => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
          const ctx = canvas.getContext("2d");

          ctx.filter = getComputedStyle(document.getElementById("mainCanvas")).filter;
          ctx.drawImage(img, 0, 0);

          const tLayer = document.getElementById("movableTextLayer");
          if (tLayer.classList.contains("active")) {
            ctx.filter = "none";
            const textVal = document.getElementById("textLayerDisplay").innerText;
            ctx.font = `bold ${layers.text.fontSize * (canvas.width/document.getElementById("mainCanvas").clientWidth)}px ${document.getElementById("textFontVal").value}, sans-serif`;
            ctx.fillStyle = document.getElementById("textColorVal").value;
            ctx.shadowColor = "rgba(0,0,0,0.8)"; ctx.shadowBlur = 10;
            
            ctx.save();
            ctx.translate(canvas.width * layers.text.relX, canvas.height * layers.text.relY);
            ctx.rotate((layers.text.rotation * Math.PI) / 180);
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText(textVal, 0, 0);
            ctx.restore();
          }

          const downloadUrl = canvas.toDataURL("image/jpeg", 0.95);
          const link = document.createElement("a");
          link.href = downloadUrl;
          link.download = `ProEdit_${Date.now()}.jpg`;
          document.body.appendChild(link); link.click(); document.body.removeChild(link);
          hideLoader();
        };
        img.src = currentImageSrc;
      }, 800);
    }

    function resetAllEditor() {
      if (!confirm("Are you sure you want to reset all edits?")) return;
      currentImageSrc = originalImageSrc;
      document.getElementById("mainCanvas").src = originalImageSrc;
      resetAdjustments();
      selectFilter('none', document.querySelectorAll(".filter-card")[0]);
      removeLayer('text'); removeLayer('pip');
      saveHistory(); // Save the reset state to history
    }
  </script>
</body>
</html>
